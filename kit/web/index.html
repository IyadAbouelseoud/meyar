<!doctype html>
<html lang="ar" dir="rtl" data-theme="paper" data-voice="clinician" data-elder="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meyar kit · سلسلة حفظ العيّنة</title>
<link rel="stylesheet" href="/design/fonts/fonts.css">
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/design/meyar.css">
<link rel="stylesheet" href="/web/kit.css">
</head>
<body class="m-body m-grain">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-stop" viewBox="0 0 24 24"><path d="M8 2.5h8l5.5 5.5v8L16 21.5H8L2.5 16V8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7.5 12h9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.25" fill="currentColor"/></symbol>
  <symbol id="i-none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3.2 2.6"/><path d="M8.5 12h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M3 21v-5M7.5 21v-8M12 21V9M16.5 21v-8M21 21v-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M12 1.8 14.3 4.6 12 7.4 9.7 4.6z" fill="currentColor"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 14h3v3h-3zM18 18h3v3h-3zM18 14h3M14 18v3" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M3 11.5 21 3l-6.5 18-3-7.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
</svg>

<header class="kit-bar">
  <a class="m-wordmark" href="/" aria-label="Meyar"><svg class="m-wordmark__tick" aria-hidden="true"><use href="#i-mark"/></svg><span class="m-wordmark__ar" lang="ar">مِعيار</span><span class="m-wordmark__en" lang="en">Meyar</span></a>
  <div class="kit-bar__title"><span class="m-eyebrow" data-t="eyebrow"></span><h1 data-t="title"></h1></div>
  <div class="kit-bar__end">
    <span class="m-mock" data-t="mock"></span>
    <div class="m-seg" role="group" aria-label="Language / اللغة">
      <button type="button" data-lang="ar" lang="ar">العربية</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
  </div>
</header>
<p class="m-proto kit-proto"><svg aria-hidden="true" width="16" height="16"><use href="#i-info"/></svg><span data-t="proto"></span></p>

<main class="kit-main">
  <section class="kit-sheet m-chartpaper" aria-labelledby="kit-id">
    <div class="kit-head">
      <div>
        <span class="m-eyebrow" data-t="kitLabel"></span>
        <h2 id="kit-id" class="m-data kit-id">—</h2>
        <p class="kit-sub"><span data-t="patientLabel"></span> <span class="m-data" id="patient-id">—</span> · <span data-t="specimenLabel"></span> <span class="m-data" id="specimen-ref">—</span></p>
      </div>
      <p class="kit-progress" id="progress" aria-live="polite"></p>
    </div>
    <ol class="m-chain kit-chain" id="chain" aria-label=""></ol>
    <div class="kit-verify">
      <div class="kit-verify__row">
        <button class="m-btn m-btn--secondary" type="button" id="verify"><svg aria-hidden="true"><use href="#i-lock"/></svg><span data-t="verify"></span></button>
        <div class="m-seg" role="group" id="source-seg" aria-label="">
          <button type="button" data-source="fhir" data-t="srcFhir"></button>
          <button type="button" data-source="ledger" data-t="srcLedger"></button>
        </div>
      </div>
      <div id="verify-result" aria-live="polite"></div>
      <p class="kit-note" data-t="honest"></p>
    </div>
  </section>

  <aside class="kit-side">
    <section class="kit-panel" aria-labelledby="scan-h">
      <h2 id="scan-h" data-t="scanTitle"></h2>
      <p class="kit-next" id="next"></p>
      <form id="scan-form" class="kit-form" autocomplete="off">
        <label for="code" data-t="scanLabel"></label>
        <input class="m-input m-data" id="code" name="code" inputmode="text" spellcheck="false">
        <p class="kit-hint" data-t="scanHint"></p>
        <label for="place" data-t="placeLabel"></label>
        <input class="m-input" id="place" name="place">
        <label for="actor" data-t="actorLabel"></label>
        <input class="m-input" id="actor" name="actor">
        <button class="m-btn m-btn--block" type="submit" id="record"><svg aria-hidden="true"><use href="#i-send"/></svg><span id="record-label"></span></button>
        <div id="scan-error" aria-live="assertive"></div>
      </form>
    </section>

    <section class="kit-panel" aria-labelledby="labels-h">
      <h2 id="labels-h" data-t="labelsTitle"></h2>
      <div class="kit-labels">
        <figure class="kit-label">
          <div class="kit-label__code" id="c128"></div>
          <figcaption><span data-t="tubeLabel"></span><span class="m-data" id="c128-text"></span></figcaption>
        </figure>
        <figure class="kit-label kit-label--qr">
          <div class="kit-label__code" id="qr"></div>
          <figcaption><span data-t="mailerLabel"></span><span class="m-data" id="qr-text"></span></figcaption>
        </figure>
      </div>
      <p class="kit-note" data-t="labelsNote"></p>
    </section>

    <section class="kit-panel" aria-labelledby="handoff-h">
      <h2 id="handoff-h" data-t="handoffTitle"></h2>
      <div id="handoff"></div>
    </section>

    <section class="kit-panel kit-panel--demo" aria-labelledby="demo-h">
      <h2 id="demo-h" data-t="demoTitle"></h2>
      <div class="kit-demo">
        <button class="m-btn m-btn--quiet" type="button" id="tamper" data-t="tamper"></button>
        <button class="m-btn m-btn--quiet" type="button" id="restore" data-t="restore"></button>
        <button class="m-btn m-btn--quiet" type="button" id="reset" data-t="reset"></button>
      </div>
    </section>
  </aside>
</main>

<footer class="kit-foot"><p class="m-proto"><span data-t="footer"></span></p></footer>
<script type="module" src="/web/app.js"></script>
</body>
</html>
